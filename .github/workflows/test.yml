name: tests

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8   # Windows runner 控制台默认编码无法编中 PASS/FAIL 符号，强制 UTF-8

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install PyQt5 qrcode

      - name: Run core tests
        shell: pwsh
        run: |
          python -X utf8 test_core.py 2>&1 | Tee-Object -Variable out
          ($out | Select-String '\[FAIL\]') | ForEach-Object { "::error::$($_.Line)" }
          exit $LASTEXITCODE

      - name: Run UI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -X utf8 smoke_ui.py 2>&1 | Tee-Object -Variable out
          ($out | Select-String 'Traceback|Error') | ForEach-Object { "::error::$($_.Line)" }
          exit $LASTEXITCODE
# rerun check
